[project]
name = "kap-radar"
version = "0.1.0"
description = "BIST KAP 'Yeni İş İlişkisi' bildirimlerini çıkarım hattından geçiren analiz motoru"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
    # 1.0 Modest ayrıştırıcısını kaldırdı (`selectolax.parser` ImportError);
    # 2026-10-05 koşusu bütün adımlarda bu yüzden düştü. Lexbor'a geçiş
    # ayrıştırma sonucunu değiştirebilir, arşivle karşılaştırılmadan açılmaz.
    "selectolax>=0.4,<1",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.2",
    "yfinance>=1.7",
    "pypdf>=5.0",
]

[project.optional-dependencies]
# pyflakes: testler `scripts/` altını koşturmuyor ve 2026-09-20'de orada
# tanımsız bir ad (yarım kalmış bir düzenleme) 221 testin hiçbirine
# takılmadan durdu. `python -m pyflakes scripts src` bunu saniyede görür.
dev = ["pytest>=9.0", "pyflakes>=3.4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Resmî TÜFE tablosu (kap_radar.tufe) paketle birlikte gider.
[tool.setuptools.package-data]
kap_radar = ["*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
