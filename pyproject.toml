[project]
name = "kap-radar"
version = "0.1.0"
description = "BIST KAP 'Yeni İş İlişkisi' bildirimlerini çıkarım hattından geçiren analiz motoru"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.13",
    "selectolax>=0.4",
    "psycopg[binary]>=3.3",
    "python-dotenv>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=9.0"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
